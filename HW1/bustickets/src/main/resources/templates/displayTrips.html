<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Display Trips</title>
</head>
<body>
    <h1>Available Trips</h1>
    <table>
        <thead>
            <tr>
                <th>Trip ID</th>
                <th>Origin</th>
                <th>Destination</th>
                <th>Departure DateTime</th>
                <th>Arrival DateTime</th>
                <th>Company</th>
                <th>Price</th>
                <!-- Add more columns as needed -->
            </tr>
        </thead>
        <tbody>
            <tr th:each="trip : ${trips}">
                <td th:text="${trip.id}"></td>
                <td th:text="${trip.origin}"></td>
                <td th:text="${trip.destination}"></td>
                <td th:text="${trip.departureDateTime}"></td>
                <td th:text="${trip.arrivalDateTime}"></td>
                <td th:text="${trip.company}"></td>
                <td th:text="${trip.price}"></td>
                <!-- Add more cells as needed -->
            </tr>
        </tbody>
    </table>
</body>
</html>
