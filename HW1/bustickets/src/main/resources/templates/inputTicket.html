<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Input Ticket Data</title>
</head>
<body>
    <h1>Input Ticket Data</h1>
    <form action="#" th:action="@{/api/tickets}" th:object="${ticket}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" th:field="*{name}" required>

        <!-- Add input fields for other ticket data properties -->

        <button type="submit">Buy Ticket</button>
    </form>
</body>
</html>
