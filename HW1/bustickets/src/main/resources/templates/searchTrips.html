<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Trips</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Search Trips</h1>
    <form action="#" th:action="@{/api/trips}" th:object="${searchForm}" method="get">
        <label for="startLocation">Start Location:</label>
        <input type="text" id="startLocation" name="startLocation" th:field="*{startLocation}" required>

        <label for="endLocation">End Location:</label>
        <input type="text" id="endLocation" name="endLocation" th:field="*{endLocation}" required>

        <!-- <label for="dateTime">Date and Time:</label>
        <input type="datetime-local" id="dateTime" name="dateTime" th:field="*{dateTime}"> -->

        <button type="submit">Search</button>
    </form>
</body>
</html>
